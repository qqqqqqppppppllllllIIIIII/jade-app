name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        working-directory: app
        run: npm ci

      - name: Sync Capacitor (web assets into iOS)
        working-directory: app
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: app/ios/App
        run: pod install

      - name: Archive (no code signing)
        working-directory: app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create Payload and package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r app/ios/App/build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r unsigned-ipa.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: unsigned-ipa.ipa
